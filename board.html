<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/base.css"><title>Bảng vàng khoa bảng UDIKA</title></head><body><main class="wrap"><header class="hero"><div class="eyebrow">✦ UDIKA GAME HUB ✦</div><h1 class="title">LONG BẢNG VINH DANH</h1><p>🏆 TRẠNG NGUYÊN · BẢNG NHÃN · THÁM HOA 🏆</p><nav><a href="/">Vào trường thi</a></nav></header><div class="panel"><div id="count" class="center muted"></div><div id="list"></div><p class="small muted center">Bảng vàng cập nhật 5 giây/lần. Người chơi phải hoàn thành 15 câu mới được ghi danh.</p></div></main><script>async function refresh(){try{let r=await fetch('/api/board',{cache:'no-store'}),v=await r.json();document.getElementById('count').textContent=v.total+' sĩ tử hoàn thành';let top=v.leaderboard;document.getElementById('list').innerHTML=top.length?top.map(p=>`<div class="rank"><span>${p.rank<=3?['🥇','🥈','🥉'][p.rank-1]:'#'+p.rank} ${p.avatar} ${esc(p.name)} ${p.rank===1?'— TRẠNG NGUYÊN':p.rank===2?'— BẢNG NHÃN':p.rank===3?'— THÁM HOA':''}</span><b>${p.score.toLocaleString('vi-VN')} điểm</b></div>`).join(''):'<p class="center muted">Chưa có sĩ tử ghi danh. Hãy là người đầu tiên!</p>'}catch(e){document.getElementById('count').textContent='Không thể tải bảng vàng'}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}refresh();setInterval(refresh,5000)</script></body></html>
